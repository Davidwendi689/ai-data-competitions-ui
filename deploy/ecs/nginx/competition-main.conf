# Main-domain configuration only; mutually exclusive with maintenance config.
server {
    listen 80;
    server_name ai-data-competitions.cn www.ai-data-competitions.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/competition-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://ai-data-competitions.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.ai-data-competitions.cn;
    ssl_certificate /opt/competition-acme-20261021/config/live/competition-main-20261021/fullchain.pem;
    ssl_certificate_key /opt/competition-acme-20261021/config/live/competition-main-20261021/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/competition-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://ai-data-competitions.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name ai-data-competitions.cn;
    ssl_certificate /opt/competition-acme-20261021/config/live/competition-main-20261021/fullchain.pem;
    ssl_certificate_key /opt/competition-acme-20261021/config/live/competition-main-20261021/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 101m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/competition-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /api/uploads {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_ignore_client_abort off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        client_body_timeout 1320s;
        proxy_read_timeout 1320s;
        proxy_send_timeout 1320s;
    }
    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
