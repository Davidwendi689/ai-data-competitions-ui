# Main-domain configuration only; mutually exclusive with main config.
server {
    listen 80;
    listen 443 ssl;
    server_name ai-data-competitions.cn www.ai-data-competitions.cn;
    ssl_certificate /opt/competition-acme-20261021/config/live/competition-main-20261021/fullchain.pem;
    ssl_certificate_key /opt/competition-acme-20261021/config/live/competition-main-20261021/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    charset utf-8;
    client_max_body_size 101m;
    access_log off;
    error_log /opt/competition-staging/maintenance-logs-20261021/error.log warn;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "300" always;
    add_header X-Content-Type-Options "nosniff" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/competition-acme;
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    error_page 503 =503 /_competition_maintenance.html;
    location = /_competition_maintenance.html {
        internal;
        alias /opt/competition-maintenance-public-20261021/maintenance.html;
        default_type text/html;
        etag off;
        if_modified_since off;
    }
    location / { return 503; }
}
